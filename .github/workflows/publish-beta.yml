name: Publish ValhallaMMO Integration Beta
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/publish-beta.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release JAR (failure blocks publication)
        run: bash ./gradlew clean shadowJar --no-daemon --stacktrace
      - name: Verify shaded JAR
        shell: bash
        run: |
          set -euo pipefail
          find build/libs -maxdepth 1 -name '*.jar' -type f -print
          test "$(find build/libs -maxdepth 1 -name '*.jar' -type f | wc -l)" -ge 1
      - name: Publish prerelease with beta warning
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v2.2.0-valhalla-beta.1
          cat > beta-notes.md <<'NOTES'
          # ⚠️ BETA TEST RELEASE — NOT STABLE

          **Experimental ValhallaMMO + BetterDamage integration for Minecraft / Purpur 26.3.**
          This build has not been verified on a live server. **Back up your server, world, and plugin configs before installing.** Use it on a test server first.

          ### Included
          - Optional ValhallaMMO damage-category indicators, with per-type effects.
          - Optional player-healing indicators.
          - Configurable damage glyphs and resource-pack font IDs.
          - Integration is **disabled by default**, and generic BetterDamage indicators remain available.
          - Modern ModelEngine v4 support is retained. Legacy ModelEngine v3 support is disabled in this beta due to an incompatible dependency.

          ### Known limitations / testing required
          - Custom damage value and timing (including ValhallaMMO delayed damage) may need adjustments.
          - Healing trigger handles Bukkit player healing, not all plugin-driven health changes.
          - ValhallaMMO's native indicator may need disabling separately to prevent visual duplication.
          - Existing BetterDamage skin configurations may need manually merging the new `valhalla_*` entries.
          - Glyph appearance requires an appropriate installed resource pack/font.
          - **Do not use as a production release until you've tested it.**

          Enable using `valhalla-integration.enabled: true` in BetterDamage's config after installation; restart and test on Purpur 26.3.

          Report errors with your server version and startup/stack-trace logs to this repository's Issues page.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/libs/*.jar --clobber
            gh release edit "$tag" --prerelease --notes-file beta-notes.md
          else
            gh release create "$tag" build/libs/*.jar --target "$GITHUB_SHA" --title "BetterDamage + ValhallaMMO v2.2.0 Beta 1 ⚠️" --prerelease --notes-file beta-notes.md
          fi
