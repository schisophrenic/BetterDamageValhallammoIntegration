# BetterDamage ValhallaMMO integration. Each effect has an independent glyph-font.
# For custom glyphs, replace glyph with your resource-pack character and set
# glyph-font: "namespace:font_name". Digits still use BetterDamage's number font.
# Configure on/off in BetterDamage/config.yml under valhalla-integration.

valhalla_fire:
  image: default_image
  glyph: "🔥"
  glyph-font: "minecraft:default"
  color: "#FF7440"
  duration: 20
  interval: 2
  show-global-player: false
  number-format: "#.#"
  transformation:
    position:
      x: 0
      y: 1.5sin(t / 40 * pi)
      z: 0
    rotation:
      x: 60(r - 0.5)
      y: 60(r - 0.5)
      z: 0
    scale:
      x: cos(t / 40 * pi)
      y: cos(t / 40 * pi)
      z: cos(t / 40 * pi)

