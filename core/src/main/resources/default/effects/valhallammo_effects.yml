# Auto-installed defaults. Each ValhallaMMO type gets its own bitmap icon.
# Existing files are left untouched when BetterDamage is updated.
valhallammo_fire:
    image: default_image
    icon-image: valhallammo_icons
    icon: "\uE200"
    icon-color: "#FF7847"
    color: "#FF7847"
    duration: 20
    interval: 2
    show-global-player: true
    transformation:
        position:
            x: 0
            y: 1.5sin(t / 40 * pi)
            z: 0
        rotation:
            x: 60(r - 0.5)
            y: 60(r - 0.5)
            z: 0
        scale:
            x: cos(t / 40 * pi)
            y: cos(t / 40 * pi)
            z: cos(t / 40 * pi)

