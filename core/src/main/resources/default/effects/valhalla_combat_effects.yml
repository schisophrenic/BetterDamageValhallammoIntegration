# New ValhallaMMO combat indicators for BetterDamage beta 2.
# These effects use the same BetterDamage renderer and can be edited independently.
# 'hide-number' supports labels such as BLOCKED and DODGED.
# Set 'glyph-font' to any valid Minecraft font key for resource-pack glyphs.

valhalla_blocked:
  image: default_image
  glyph: "BLOCKED"
  glyph-font: "minecraft:default"
  hide-number: true
  color: "#80B9F5"
  duration: 24
  interval: 2
  show-global-player: false
  number-format: "#.#"
  transformation:
    position:
      x: 0
      y: 1.8sin(t / 48 * pi)
      z: 0
    rotation:
      x: 40(r - 0.5)
      y: 40(r - 0.5)
      z: 0
    scale:
      x: 1.15cos(t / 48 * pi)
      y: 1.15cos(t / 48 * pi)
      z: 1.15cos(t / 48 * pi)

