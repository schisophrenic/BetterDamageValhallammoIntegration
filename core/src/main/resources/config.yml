debug: false #debug
metrics: true #https://bstats.org/plugin/bukkit/BetterDamage/24961
namespace: "betterdamage" #Resource pack namespace
pack-path: "BetterDamage/build"
pack-type: zip #folder, zip
auto-save-time: 300
skip-zero-damage: true
default-effect: "null" #Default effect
default-skin: "default_skin"
merge-with-external-resources: true
# Optional ValhallaMMO integration (requires installed and enabled ValhallaMMO).
# Configure glyph text and fonts under effects/valhalla_effects.yml.
valhalla-integration:
  enabled: false
  damage:
    enabled: true
  healing:
    enabled: true
  glyphs:
    enabled: true
